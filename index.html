<title>SPLE Prep Simulator</title>

<style>
/* Layout: sticky app bar + stepper, one centred working column per screen, slide-in drawer for community/faculty, toast nudges bottom-right. Light-blue platform theme with a teal accent. */
:root{
  --bg:#EFF6FD; --surface:#FFFFFF; --sunk:#E1EDF9; --ink:#12304F; --muted:#4D6580; --line:#CBDDF0;
  --navy:#1F6FB5; --navy-ink:#FFFFFF; --gold:#139C9C; --gold-ink:#0B7474; --gold-soft:#DDF3F2;
  --hi:#A6DCF7; --hi-ink:#0B2A4A;
  --good:#1F7A4D; --good-soft:#E3F2EA; --bad:#B23A2E; --bad-soft:#FBE9E6; --dev:#5B3FA8; --dev-soft:#EFEAFB;
  --display:'Bricolage Grotesque',Georgia,serif; --body:'IBM Plex Sans',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1828; --surface:#13233A; --sunk:#1A2E4A; --ink:#E4EEF8; --muted:#9DB3CC; --line:#28405F;
  --navy:#1E5F9C; --navy-ink:#FFFFFF; --gold:#4FCFCF; --gold-ink:#7FDCDC; --gold-soft:#113637;
  --hi:#A6DCF7; --hi-ink:#0B2A4A;
  --good:#5CC48E; --good-soft:#15301F; --bad:#F0806F; --bad-soft:#3A1C18; --dev:#B9A2F5; --dev-soft:#241C3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1828; --surface:#13233A; --sunk:#1A2E4A; --ink:#E4EEF8; --muted:#9DB3CC; --line:#28405F;
  --navy:#1E5F9C; --navy-ink:#FFFFFF; --gold:#4FCFCF; --gold-ink:#7FDCDC; --gold-soft:#113637;
  --hi:#A6DCF7; --hi-ink:#0B2A4A;
  --good:#5CC48E; --good-soft:#15301F; --bad:#F0806F; --bad-soft:#3A1C18; --dev:#B9A2F5; --dev-soft:#241C3D; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
.bar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font:700 20px var(--display);letter-spacing:.2px;margin-right:auto}
.brand small{font:500 12px var(--mono);color:var(--hi);letter-spacing:.1em;margin-left:8px;text-transform:uppercase}
.plan6{font:500 12.5px var(--mono);background:var(--hi);color:var(--hi-ink);padding:5px 10px;border-radius:999px;white-space:nowrap}
.bar button{font:500 13px var(--body);color:var(--navy-ink);background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 11px;cursor:pointer}
.bar button:hover{border-color:var(--hi)}
.bar button[aria-pressed="true"]{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.steps{background:var(--surface);border-bottom:1px solid var(--line)}
.steps ol{max-width:1120px;margin:0 auto;list-style:none;display:flex;gap:4px;padding-block:10px;padding-inline:0;overflow-x:auto;scrollbar-width:thin}
.steps li{font:500 12.5px var(--mono);white-space:nowrap;padding:5px 10px;border-radius:999px;color:var(--muted);background:var(--sunk)}
.steps li.done{color:var(--good);background:var(--good-soft)}
.steps li.now{color:var(--navy-ink);background:var(--navy)}
main{max-width:1120px;margin:0 auto;padding-block:28px 96px;display:flex;flex-direction:column;gap:20px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
h1{font:700 clamp(26px,3.6vw,38px)/1.12 var(--display);margin:0;color:var(--ink);text-wrap:balance}
h2{font:600 22px/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 17px/1.3 var(--body);margin:0}
p{margin:0}
.lead{color:var(--muted);max-width:70ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid3,.grid2{grid-template-columns:minmax(0,1fr)}}
.btn{font:600 14.5px var(--body);border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid transparent;background:var(--navy);color:var(--navy-ink)}
.btn:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);color:#16213A}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pill{font:500 12px var(--mono);padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.gold{background:var(--gold-soft);color:var(--gold-ink)}
.tier{position:relative}
.tier.off{opacity:.55}
.tier.on{border:2px solid var(--gold);box-shadow:0 10px 28px rgba(27,43,82,.12)}
.price{font:700 28px var(--display);color:var(--ink)}
.tier ul,.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.dev{border:1px dashed var(--dev);background:var(--dev-soft);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.dev b.tag{font:500 11.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dev)}
.dev ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
body.nodev .dev{display:none}
.pay{display:flex;gap:10px;flex-wrap:wrap}
.paym{flex:1 1 140px;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;opacity:.5;background:var(--sunk);cursor:not-allowed}
.paym b{font-size:15px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
input:disabled{background:var(--sunk);opacity:.6}
.err{color:var(--bad);font-size:14px}
.hint{font:13px var(--mono);color:var(--muted)}
.bp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mod{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.mod .c{font:500 12.5px var(--mono);color:var(--gold-ink)}
.mod.gate{background:var(--gold-soft)}
.mod.ns .c{color:var(--navy)}
:root[data-theme="dark"] .mod.ns .c{color:#DCEEFB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mod.ns .c{color:#DCEEFB}}
.mod .n{font-size:13.5px;line-height:1.3}
.mod.done{border-color:var(--good)} .mod.done .c::after{content:" · done";color:var(--good)}
.mod.cur{outline:2px solid var(--gold)}
.q{display:flex;flex-direction:column;gap:12px}
.stem{font-size:16.5px;line-height:1.5;max-width:75ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;display:flex;gap:10px}
.opt:hover{border-color:var(--gold)}
.opt .k{font:600 14px var(--mono);color:var(--muted);min-width:18px}
.opt.sel{border:2px solid var(--navy)}
.opt.right{border:2px solid var(--good);background:var(--good-soft)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-soft)}.fb.bad{background:var(--bad-soft)}
.fb b{font-weight:600}
.remed{background:var(--gold-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:500 13.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.tabs button.ok::after{content:" ✓";color:var(--good)}
.video{aspect-ratio:16/9;max-width:100%;background:linear-gradient(135deg,#1F6FB5,#3A9AD9);border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#F4F6FB;text-align:center;padding:16px}
.video .play{width:56px;height:56px;border-radius:50%;background:var(--hi);display:flex;align-items:center;justify-content:center}
.video .play::after{content:"";border-left:18px solid var(--hi-ink);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.big{font:700 64px/1 var(--display);color:var(--gold-ink);font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:10px;align-items:center;font-size:14px}
.track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--navy)}
.fill.good{background:var(--good)}.fill.mid{background:var(--gold)}.fill.bad{background:var(--bad)}
.num{font:500 13.5px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.navgrid button{font:500 12px var(--mono);padding:6px 0;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.navgrid button.ans{background:var(--sunk)}
.navgrid button.cur{outline:2px solid var(--gold)}
.navgrid button.flag{border-color:var(--bad);color:var(--bad)}
.examhead{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--navy);color:var(--navy-ink);border-radius:12px;padding:12px 16px}
.timer{font:600 18px var(--mono);color:var(--hi);font-variant-numeric:tabular-nums}
.plan{display:flex;flex-direction:column;gap:6px}
.plan .wk{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.plan .wk span:first-child{font:500 13px var(--mono);color:var(--muted)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--navy);color:var(--navy-ink);border-left:4px solid var(--hi);border-radius:10px;padding:11px 14px;font-size:14px;box-shadow:0 10px 24px rgba(0,0,0,.18);animation:in .25s ease-out}
.toast b{color:var(--hi);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;display:block}
@keyframes in{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{background:var(--sunk);border-radius:12px;padding:9px 12px;font-size:14px;max-width:90%}
.msg.me{align-self:flex-end;background:var(--gold-soft)}
.msg small{display:block;font:500 11.5px var(--mono);color:var(--muted);margin-bottom:2px}
.dfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.loginwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:stretch}
@media (max-width:820px){.loginwrap{grid-template-columns:minmax(0,1fr)}}
.hero{background:#1F6FB5;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.hero svg{display:block;width:100%;height:auto;max-width:100%}
.herotext{padding:14px 18px 18px;display:flex;flex-direction:column;gap:4px;color:#F4F6FB}
.herotext b{font:600 16px var(--body);color:var(--hi)}
.herotext span{color:#DCEEFB;font-size:14.5px}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{font:500 13.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
.slots button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.slots button:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.ovtop{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.ovtop{grid-template-columns:minmax(0,1fr)}}
.ovside{display:flex;flex-direction:column;gap:16px;min-width:0}
.cover{padding:0;overflow:hidden;box-shadow:0 14px 34px rgba(31,111,181,.18)}
.cover svg{display:block;width:100%;height:auto;max-width:100%}
a.video{text-decoration:none}a.video:hover .play{transform:scale(1.06)}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.35);z-index:45}
</style>

<header class="bar gutter"><div class="bar-in">

</div></header>

<script>
/* ---------- Data ---------- */
const MODS=[
['B0','Orientation & diagnostic',0,'gate','The SPLE is a computer-based exam of 200 four-option MCQs in two 120-minute blocks with a 30-minute break. Up to 10% are unscored pilot items. The pass standard is 536 on the SCFHS 200–800 scale.'],
['B1','Patient assessment & evidence',8,'gate','Take a structured history, interpret labs, find drug therapy problems and grade evidence: meta-analyses of RCTs sit at the top, expert opinion at the bottom.'],
['B2','Calculations, PK & dosing',8,'gate','Cockcroft–Gault: CrCl = (140 − age) × weight ÷ (72 × SCr), × 0.85 for women. Percentage w/v = grams per 100 mL.'],
['B3','Cardiovascular',7,'','HFrEF: ACEI/ARB/ARNI + beta-blocker + MRA + SGLT2 inhibitor reduce mortality. Warfarin in AF: target INR 2.0–3.0. ACEI/ARB for hypertension with albuminuria.'],
['B4','Endocrine & metabolic',6,'','Metformin is first line in type 2 diabetes unless contraindicated. Levothyroxine: empty stomach, 30–60 min before breakfast, apart from calcium and iron.'],
['B5','Respiratory & immunization',4,'','Short-acting beta-agonists (salbutamol) give quick relief. Rinse and spit after inhaled corticosteroids to prevent oral candidiasis.'],
['B6','Infectious diseases',8,'','Nitrofurantoin for uncomplicated cystitis. Fluoroquinolones chelate with dairy and antacids. Vancomycin is dosed by AUC or trough monitoring.'],
['B7','Renal, fluids & electrolytes',5,'','ACEI + spironolactone raises potassium. Metformin is contraindicated when eGFR is below 30 mL/min/1.73 m².'],
['B8','GI, hepatic & nutrition',5,'','H. pylori triple therapy: PPI + clarithromycin + amoxicillin. Lactulose lowers ammonia in hepatic encephalopathy.'],
['B9','Neurology & psychiatry',7,'','Lithium maintenance level about 0.6–1.0 mmol/L. Phenytoin has a narrow therapeutic index. SSRIs with tramadol or linezolid risk serotonin syndrome.'],
['B10','Oncology & haematology',5,'','Most chemotherapy is dosed by body surface area. Leucovorin rescues normal cells after high-dose methotrexate.'],
['B11','Rheum, derm & self-care',4,'','Allopurinol inhibits xanthine oxidase. Isotretinoin is teratogenic and needs a pregnancy prevention programme.'],
['B12','Women’s & men’s health',3,'','Folic acid 0.4 mg daily before conception lowers neural tube defects. PDE5 inhibitors are contraindicated with nitrates.'],
['B13','Paediatrics, geriatrics, pregnancy',5,'','First-generation antihistamines are on the Beers list for older adults. ACE inhibitors are fetotoxic and contraindicated in pregnancy.'],
['B14','Emergency & toxicology',5,'','Paracetamol overdose: N-acetylcysteine. Opioid overdose: naloxone.'],
['N1','Biomedical sciences',6,'ns','IgE mediates type I hypersensitivity. Insulin comes from beta cells of the pancreatic islets.'],
['N2','Medicinal chemistry',7,'ns','Enalapril is a prodrug converted to enalaprilat. Glucuronidation is a phase II reaction.'],
['N3','Pharmaceutics',5,'ns','Enteric coating protects acid-labile drugs or the stomach. IV administration gives 100% bioavailability.'],
['N4','Compounding',5,'ns','Sterile preparations are made in an ISO Class 5 laminar airflow hood. The beyond-use date is set for the compounded preparation itself.'],
['N5','Natural products',3,'ns','St John’s wort induces CYP3A4. Ginkgo biloba raises bleeding risk.'],
['N6','Saudi health systems',6,'ns','The SFDA registers medicines and runs the National Pharmacovigilance Centre.'],
['N7','Law & ethics',5,'ns','SCFHS classifies and registers pharmacists. Sharing patient data without consent breaches confidentiality.'],
['N8','Research & pharmacoeconomics',5,'ns','NNT = 1 ÷ absolute risk reduction. Cost per QALY is the outcome of a cost-utility analysis.']
].map(([c,n,h,t,note])=>({c,n,h,t,note}));
const MOD=Object.fromEntries(MODS.map(m=>[m.c,m]));
// [module, stem, [A,B,C,D], correctIndex, explanation]
const BANK=[
['B0','How is the SPLE delivered?',['150 MCQs in one 3-hour block','200 MCQs in two 120-minute blocks','200 MCQs in one 4-hour block','250 MCQs in two 150-minute blocks'],1,'200 four-option MCQs in two 120-minute blocks with a 30-minute break.'],
['B0','What is the SPLE pass standard on the SCFHS 200–800 scale?',['500','536','600','650'],1,'The pass standard is 536.'],
['B1','Which source gives the strongest evidence for a treatment effect?',['Case series','Cohort study','Meta-analysis of RCTs','Expert opinion'],2,'A systematic review and meta-analysis of randomised trials sits at the top of the evidence hierarchy.'],
['B1','A patient on a combined oral contraceptive starts St John’s wort. What is the main risk?',['Hyperkalaemia','Reduced contraceptive effect','QT prolongation','Hypoglycaemia'],1,'St John’s wort induces CYP3A4 and lowers hormone levels, so contraception may fail.'],
['B2','A 70-year-old man weighs 60 kg; SCr 1.4 mg/dL. Estimated CrCl (Cockcroft–Gault)?',['30 mL/min','42 mL/min','50 mL/min','58 mL/min'],1,'(140 − 70) × 60 ÷ (72 × 1.4) = 4,200 ÷ 100.8 ≈ 42 mL/min.'],
['B2','How many grams of dextrose are in 500 mL of D5W?',['5 g','10 g','25 g','50 g'],2,'D5W is 5 g per 100 mL, so 500 mL holds 25 g.'],
['B3','HFrEF (EF 30%) on lisinopril and bisoprolol; K⁺ 4.2, eGFR 65. Which addition most reduces mortality?',['Digoxin','Spironolactone','Furosemide','Amlodipine'],1,'An MRA reduces mortality in HFrEF. Digoxin lowers admissions, not deaths.'],
['B3','What is the usual target INR for warfarin in non-valvular atrial fibrillation?',['1.0–1.5','1.5–2.0','2.0–3.0','3.0–4.0'],2,'Target INR 2.0–3.0.'],
['B4','First-line drug for type 2 diabetes with no contraindications?',['Glibenclamide','Metformin','Insulin glargine','Pioglitazone'],1,'Metformin is first line unless contraindicated or not tolerated.'],
['B4','Best counselling for levothyroxine?',['Take with calcium at bedtime','Take with breakfast','Take on an empty stomach 30–60 min before breakfast','Take only when tired'],2,'Absorption is best on an empty stomach, apart from calcium and iron.'],
['B5','Which drug gives quick relief of acute bronchospasm?',['Salbutamol','Montelukast','Budesonide','Tiotropium'],0,'Salbutamol is a short-acting beta-2 agonist.'],
['B5','Rinsing the mouth after an inhaled corticosteroid prevents:',['Tremor','Oral candidiasis','Tachycardia','Hypokalaemia'],1,'Rinse and spit to prevent oral thrush.'],
['B6','Preferred drug for uncomplicated cystitis in a non-pregnant woman (normal renal function)?',['Nitrofurantoin','Vancomycin','Metronidazole','Gentamicin'],0,'Nitrofurantoin is a first-line choice for uncomplicated cystitis.'],
['B6','Vancomycin dosing is best guided by:',['INR','AUC or trough levels','TSH','HbA1c'],1,'Therapeutic drug monitoring by AUC (or trough) guides vancomycin dosing.'],
['B7','Which combination most raises the risk of hyperkalaemia?',['Furosemide + HCTZ','Lisinopril + spironolactone','Amlodipine + atorvastatin','Metformin + sitagliptin'],1,'ACE inhibitor plus potassium-sparing diuretic raises potassium.'],

${dev(['Full diagnostic: 200 items weighted to the SPLE blueprint (5 shown here)','Scoring service and the gap profile'])}`}

function diagScore(){let c=0;DIAG.forEach(it=>{if(S.diag.ans[it.id]===it.a)c++});return Math.round(c/DIAG.length*100)}
function weakMods(){return DIAG.filter(it=>S.diag.ans[it.id]!==it.a).map(it=>it.m)}
function level(p){return p>=80?['Exam ready','good']:p>=60?['Approaching readiness','gold']:['Needs foundational review','bad']}

function vResult(){const sc=diagScore(),[lv,cl]=level(sc),weak=weakMods();
const custom=[...new Set(['B3',...weak.filter(m=>m!=='B3')])];
return`
<div class="eyebrow">Step 6 · Your level and path</div>
<h1>Your diagnostic result</h1>
<div class="grid2">
 <div class="card"><span class="hint">Diagnostic score</span><div class="big">${sc}%</div><span class="pill ${cl}" style="align-self:start">${lv}</span>
 <div class="bars">${DIAG.map(it=>{const ok=S.diag.ans[it.id]===it.a;return`<div class="barrow"><span>${it.m} · ${MOD[it.m].n}</span><div class="track"><div class="fill ${ok?'good':'bad'}" style="width:${ok?100:25}%"></div></div><span class="num">${ok?'Strong':'Weak'}</span></div>`}).join('')}</div></div>
 <div class="card"><h3>Choose how to study</h3>
  <div class="card" style="background:var(--gold-soft);border-color:transparent"><h3>Customised plan (recommended)</h3><p>Starts with your weak areas: <b>${custom.join(' → ')}</b>, then the rest of the curriculum.</p><button class="btn gold" type="button" data-act="pathCustom">Start customised plan</button></div>
  <div class="card" style="background:var(--sunk);border-color:transparent"><h3>Regular flow</h3><p>General preparation in curriculum order: B1 → B2 → B3 Cardiovascular → B4 Endocrine → … → N8.</p><button class="btn ghost" type="button" data-act="pathRegular">Start regular flow</button></div>
 </div>
</div>
${dev(['Plan generator: orders modules from diagnostic gaps, or uses the regular sequence','6-month calendar with weekly targets','Nudges by email, push or SMS (SMS has a per-message cost)'])}`}

function weekPlan(){const n=S.order.length,per=24/n;return S.order.slice(0,8).map((c,i)=>`<div class="wk"><span>Weeks ${Math.round(i*per)+1}–${Math.max(Math.round((i+1)*per),Math.round(i*per)+1)}</span><span>${c} · ${MOD[c].n}</span></div>`).join('')+`<div class="wk"><span>Weeks 25–26</span><span>Mock SPLE and final readiness review</span></div>`}

function vModule(){const c=S.order[S.cur],m=MOD[c],t=S.mod.tab,items=BANK.filter(b=>b.m===c),pr=items[0],as=items[1];
const tabs=[['learn','1 Learn'],['bank','2 Question bank'],['assess','3 Module assessment']];
let body='';
if(t==='learn')body=`<div class="grid2">${c==='B2'?`<a class="video" href="https://www.youtube.com/watch?v=mjTMZ_sm0LQ" target="_blank" rel="noopener"><div class="play"></div><b>B2 microlecture</b><span>${m.n} · plays on YouTube (opens a new tab)</span></a>`:`<div class="video"><div class="play"></div><b>${c} microlecture</b><span>${m.n} · 15–25 min</span></div>`}<div class="card" style="border:0;padding:0"><h3>High-yield note</h3><p>${esc(m.note)}</p><button class="btn" type="button" data-act="tab" data-t="bank">Go to the question bank</button></div></div>`;
if(t==='bank'||t==='assess'){const it=t==='bank'?pr:as,ok=S.mod.pick===it.a;
 body=`<p class="hint">${t==='bank'?'Tutor mode · feedback straight after you answer':'Timed mastery check · unseen item · target 75%'}</p>${qHTML(it,S.mod.pick,S.mod.checked,'modPick')}`;
 if(!S.mod.checked)body+=`<div class="row"><span class="spacer"></span><button class="btn" type="button" data-act="modCheck" ${S.mod.pick==null?'disabled':''}>Submit answer</button></div>`;
 else if(ok)body+=`<div class="fb good"><b>Correct.</b><span>${esc(it.e)}</span></div><div class="row"><span class="spacer"></span><button class="btn gold" type="button" data-act="${t==='bank'?'toAssess':'nextMod'}">${t==='bank'?'Continue to module assessment':(S.cur<S.order.length-1?'Next module: '+S.order[S.cur+1]:'Go to the mock exam')}</button></div>`;
 else body+=`<div class="fb bad"><b>Incorrect.</b><span>${esc(it.e)}</span></div><div class="remed"><b>Remediation</b><span>Review the ${c} microlecture and note: ${esc(m.note)}</span><div class="row"><button class="btn ghost" type="button" data-act="tab" data-t="learn">Open ${c} review</button><button class="btn" type="button" data-act="retry">Try again</button>${t==='assess'?`<button class="btn ghost" type="button" data-act="nextMod">Continue anyway</button>`:''}</div></div>`;}
return`
<div class="eyebrow">Step 7 · Modules · ${S.path==='custom'?'Customised plan':'Regular flow'} · module ${S.cur+1} of ${S.order.length}</div>
<h1>${c} · ${m.n}</h1>
<div class="row"><div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button type="button" role="tab" aria-selected="${t===k}" class="${(k==='bank'&&S.mod.bankOk)||(k==='assess'&&S.assess[c]!=null)?'ok':''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div><span class="spacer"></span><button class="btn ghost" type="button" data-act="skipToMock">Skip to mock exam (simulation)</button></div>
<div class="card">${body}</div>
<div class="grid2"><div class="card"><h3>Your 6-month plan</h3><div class="plan">${weekPlan()}</div></div><div class="card"><h3>Blueprint progress</h3>${bp(c)}</div></div>
${dev(['Microlecture production (per video) and video hosting/streaming',c==='B2'?'Sample lecture here links to YouTube; the real platform needs an embedded player (LMS streaming, Vimeo or unlisted YouTube) and permission to use any third-party video':'Video player and streaming','High-yield notes and drug tables per module','Question bank: 30–80 practice items per module, written and peer reviewed','Mastery items: 20–40 unseen items per module','Link from every item to its review material'])}`}

function vMock(){const k=S.mock,it=BANK[k.i],ans=Object.keys(k.ans).length,mm=String(Math.floor(k.secs/60)).padStart(2,'0'),ss=String(k.secs%60).padStart(2,'0');return`
<div class="eyebrow">Step 8 · Mock SPLE</div>
<div class="examhead"><b>Mock exam · ${BANK.length} items (2 per module)</b><span class="spacer"></span><span>Answered ${ans}/${BANK.length}</span><span class="timer" id="timer">${mm}:${ss}</span></div>
<div class="card"><div class="row"><span class="pill">Item ${k.i+1} · ${it.m}</span><span class="spacer"></span><button class="btn ghost" type="button" data-act="flag">${k.flag[k.i]?'Unflag':'Flag for review'}</button></div>
${qHTML(it,k.ans[k.i],false,'mockPick')}
<div class="row"><button class="btn ghost" type="button" data-act="mockPrev" ${k.i===0?'disabled':''}>Previous</button><span class="spacer"></span>${k.i<BANK.length-1?`<button class="btn" type="button" data-act="mockNext">Next</button>`:''}<button class="btn gold" type="button" data-act="mockSubmit">Submit exam</button></div></div>
<div class="card"><h3>Question navigator</h3><div class="navgrid">${BANK.map((b,i)=>`<button type="button" class="${k.ans[i]!=null?'ans':''} ${i===k.i?'cur':''} ${k.flag[i]?'flag':''}" data-act="mockGo" data-i="${i}" aria-label="Item ${i+1}, ${b.m}">${i+1}</button>`).join('')}</div><p class="hint">Grey = answered · red border = flagged. No feedback until you submit, as in the real exam.</p></div>
${dev(['Secure mock item pool, randomised order, audit log','Exam timer, flagging and navigator','Full mocks: 100-item progress mock, two 200-item mocks'])}`}

function mockScore(){let c=0;BANK.forEach((b,i)=>{if(S.mock.ans[i]===b.a)c++});return Math.round(c/BANK.length*100)}
function vMockResult(){const sc=mockScore(),wrong=BANK.filter((b,i)=>S.mock.ans[i]!==b.a);return`
<div class="eyebrow">Step 8 · Mock results, feedback and remediation</div>
<h1>Mock exam: ${sc}%</h1>
<p class="lead">${wrong.length} items to review. Each one links to its module review.</p>
<div class="card">${wrong.length?wrong.slice(0,12).map(b=>{const i=BANK.indexOf(b),p=S.mock.ans[i];return`<div class="fb bad"><b>${b.m} · ${esc(b.s)}</b><span>Your answer: ${p!=null?L[p]+'. '+esc(b.o[p]):'not answered'} · Correct: ${L[b.a]}. ${esc(b.o[b.a])}</span><span>${esc(b.e)}</span><span class="hint">Remediation: ${b.m} microlecture and note, then an equivalent new item</span></div>`}).join('')+(wrong.length>12?`<p class="hint">+ ${wrong.length-12} more in the full review list</p>`:''):'<div class="fb good"><b>All correct.</b></div>'}</div>
<div class="row"><span class="spacer"></span><button class="btn gold" type="button" data-act="toReady">See my readiness score</button></div>
${dev(['Item statistics after each mock (difficulty, discrimination)','Automatic remediation assignment from wrong items'])}`}

function readiness(){const d=diagScore(),a=Object.values(S.assess),as=a.length?Math.round(a.filter(Boolean).length/a.length*100):0,m=mockScore();return{d,as,m,r:Math.round(d*.2+as*.3+m*.5),n:a.length}}
function vReady(){const R=readiness(),[lv,cl]=level(R.r);const groups=[['Foundation B0–B2',['B0','B1','B2']],['Therapeutics B3–B14',MODS.filter(x=>/^B([3-9]|1[0-4])$/.test(x.c)).map(x=>x.c)],['Basic & non-therapeutic N1–N8',MODS.filter(x=>x.t==='ns').map(x=>x.c)]];
return`
<div class="eyebrow">Step 9 · Readiness score</div>
<h1>Your SPLE readiness</h1>
<div class="grid2">
 <div class="card" style="background:var(--navy);color:var(--navy-ink);border-color:transparent"><span style="color:#DCEEFB">Readiness score</span><div class="big" style="color:var(--hi)">${R.r}%</div><span class="pill ${cl}" style="align-self:start">${lv}</span><p style="color:#DCEEFB">Exam ready from 80% · illustrative weighting: diagnostic 20%, module assessments 30%, mock 50%</p></div>
 <div class="card"><h3>What the score is made of</h3><div class="bars">
  <div class="barrow"><span>Diagnostic</span><div class="track"><div class="fill" style="width:${R.d}%"></div></div><span class="num">${R.d}%</span></div>
  <div class="barrow"><span>Module assessments (${R.n})</span><div class="track"><div class="fill" style="width:${R.as}%"></div></div><span class="num">${R.as}%</span></div>
  <div class="barrow"><span>Mock exam</span><div class="track"><div class="fill" style="width:${R.m}%"></div></div><span class="num">${R.m}%</span></div></div>
  <h3>Mock by area</h3><div class="bars">${groups.map(([g,cs])=>{const its=BANK.map((b,i)=>[b,i]).filter(([b])=>cs.includes(b.m));const p=Math.round(its.filter(([b,i])=>S.mock.ans[i]===b.a).length/its.length*100);return`<div class="barrow"><span>${g}</span><div class="track"><div class="fill ${p>=80?'good':p>=60?'mid':'bad'}" style="width:${p}%"></div></div><span class="num">${p}%</span></div>`}).join('')}</div></div>
</div>
<div class="card"><h3>Next steps</h3><ul class="bul"><li>Close the remediation items from your mock review</li><li>Take the next progress mock in two weeks</li><li>Need help? Book a faculty appointment or post in the community chat (top bar)</li></ul></div>
${dev(['Readiness dashboard and scoring rules (weights and thresholds set by the academic committee)','Cohort comparison, e.g. “top 30% of this year”, if approved'])}`}

/* ---------- Render ---------- */
function render(){
 $('#steps').innerHTML=STEPS.map((s,i)=>`<li class="${i<S.step?'done':i===S.step?'now':''}">${i+1} ${s}</li>`).join('');
 const v={plans:vPlans,pay:vPay,login:vLogin,overview:vOverview,diag:vDiag,result:vResult,module:vModule,mock:vMock,mockres:vMockResult,ready:vReady}[S.screen];
 $('#view').innerHTML=v();
 $('#plan6').textContent=S.step>=3?`Premium · 6-month plan · Day ${Math.min(1+S.cur*8+(S.step>=7?150:0),180)} of 180`:'6-month preparation plan';
 const f=$('#loginForm');if(f)f.addEventListener('submit',login);
 const cur=document.querySelector('.steps li.now');if(cur)cur.scrollIntoView({block:'nearest',inline:'center'});
}
function login(e){e.preventDefault();const u=$('#user').value.trim(),p=$('#pass').value;if(u==='IAU_SPLE'&&p==='IAU_2026'){S.err='';go('overview',3,['Welcome','You are on day 1 of your 6-month plan. Start with the B0 orientation video, then take the diagnostic.'])}else{S.err='Username or password is incorrect. Use the demo account shown below.';render()}}

let timerId=null;
function startTimer(){clearInterval(timerId);timerId=setInterval(()=>{if(S.screen!=='mock'){clearInterval(timerId);return}S.mock.secs=Math.max(0,S.mock.secs-1);const t=$('#timer');if(t)t.textContent=String(Math.floor(S.mock.secs/60)).padStart(2,'0')+':'+String(S.mock.secs%60).padStart(2,'0')},1000)}

function openModule(i){S.cur=i;S.mod={tab:'learn',pick:null,checked:false,bankOk:false};go('module',6,['Next module',`${S.order[i]} · ${MOD[S.order[i]].n}: watch the microlecture first, then try the question bank.`])}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 if(a==='choosePremium')go('pay',1,['Premium selected','Good choice: Premium includes the mock SPLE, readiness score and faculty support.']);
 else if(a==='back')go(b.dataset.to,+b.dataset.step);
 else if(a==='skipPay')go('login',2,['Almost there','Sign in to start your plan.']);
 else if(a==='startDiag'){S.diag={i:0,ans:{}};go('diag',4,['Diagnostic','Answer honestly. There is no pass mark; this only builds your plan.'])}
 else if(a==='diagPick'){S.diag.ans[DIAG[S.diag.i].id]=+b.dataset.i;render()}
 else if(a==='diagPrev'){S.diag.i--;render()}
 else if(a==='diagNext'){if(S.diag.i<DIAG.length-1){S.diag.i++;render();if(S.diag.i===2)nudge('Keep going','Two questions done. Three to go.')}else go('result',5,['Profile ready','Your weak areas are highlighted. Choose a customised plan or the regular flow.'])}
 else if(a==='pathCustom'){S.path='custom';const weak=weakMods();S.order=[...new Set(['B3',...weak.filter(m=>m!=='B3'),...REGULAR])];openModule(0)}
 else if(a==='pathRegular'){S.path='regular';S.order=[...REGULAR];openModule(0)}
 else if(a==='tab'){S.mod.tab=b.dataset.t;S.mod.pick=null;S.mod.checked=false;render()}
 else if(a==='modPick'){S.mod.pick=+b.dataset.i;render()}
 else if(a==='modCheck'){S.mod.checked=true;const c=S.order[S.cur],its=BANK.filter(x=>x.m===c),it=S.mod.tab==='bank'?its[0]:its[1],ok=S.mod.pick===it.a;
   if(S.mod.tab==='assess'&&S.assess[c]==null)S.assess[c]=ok;if(S.mod.tab==='bank'&&ok)S.mod.bankOk=true;render();
   nudge(ok?'Well done':'Remediation',ok?'Correct. Keep the streak going.':'Review the note or video, then try an equivalent item. Stuck twice? Book a faculty appointment.')}
 else if(a==='retry'){S.mod.pick=null;S.mod.checked=false;render()}
 else if(a==='toAssess'){S.mod.tab='assess';S.mod.pick=null;S.mod.checked=false;render();nudge('Mastery check','One unseen item, timed. Aim for 75% across the module.')}
 else if(a==='nextMod'){const c=S.order[S.cur];S.done[c]=true;if(S.cur<S.order.length-1)openModule(S.cur+1);else startMock()}
 else if(a==='skipToMock'){S.order.forEach(c=>S.done[c]=true);startMock()}
 else if(a==='mockPick'){S.mock.ans[S.mock.i]=+b.dataset.i;render()}
 else if(a==='mockPrev'){S.mock.i--;render()}
 else if(a==='mockNext'){S.mock.i++;render();if(S.mock.i===23)nudge('Halfway','23 of 46 items. Take a breath and keep your pace.')}
 else if(a==='mockGo'){S.mock.i=+b.dataset.i;render()}
 else if(a==='flag'){S.mock.flag[S.mock.i]=!S.mock.flag[S.mock.i];render()}
 else if(a==='mockSubmit'){const left=BANK.length-Object.keys(S.mock.ans).length;if(left&&!b.dataset.sure){b.dataset.sure='1';b.textContent=`${left} unanswered · submit anyway`;return}S.mock.submitted=true;go('mockres',7,['Mock submitted','Review each wrong item and its remediation before your readiness score.'])}
 else if(a==='toReady')go('ready',8,['Readiness','This is your score today. It updates with every answer you give.']);
 else if(a==='chatSend'){const t=$('#chatIn');if(t.value.trim()){S.chat.push({who:'You',t:t.value.trim(),me:true});t.value='';drawer('chat')}}
 else if(a==='pickDay'){keepBook();S.book.day=+b.dataset.i;S.book.time=null;drawer('faculty')}
 else if(a==='pickTime'){keepBook();S.book.time=b.dataset.t;drawer('faculty')}
 else if(a==='facSend'){keepBook();S.faculty={type:S.book.type,mod:S.book.mod,day:workDays()[S.book.day],time:S.book.time};drawer('faculty');nudge('Appointment booked',`${S.faculty.day} at ${S.faculty.time}, face to face at the college. Bring your error notebook.`)}
 else if(a==='facCancel'){S.faculty=null;S.book={day:null,time:null};drawer('faculty')}
 else if(a==='close')closeDrawer();
});
function startMock(){S.mock={i:0,ans:{},flag:{},submitted:false,secs:120*60};go('mock',7,['Mock SPLE','Exam conditions: no feedback until you submit. Use the flag for items to revisit.']);startTimer()}

/* ---------- Drawer: community & faculty ---------- */
function drawer(kind){const h=$('#drawerHost');let body,foot='';
 if(kind==='chat'){body=S.chat.map(m=>`<div class="msg ${m.me?'me':''}"><small>${esc(m.who)}</small>${esc(m.t)}</div>`).join('')+dev(['Chat hosting and storage','Moderator time and community rules','Report and block tools']);
  foot=`<div class="dfoot"><label for="chatIn" class="hint" hidden>Message</label><input id="chatIn" placeholder="Write to the community"><button class="btn" type="button" data-act="chatSend">Send</button></div>`}
 else{const B=S.book,days=workDays(),f=S.faculty;
  body=f?`<div class="fb good"><b>Appointment booked (simulation)</b><span>${esc(f.day)} · ${esc(f.time)} · 30 minutes, face to face</span><span>${esc(f.type)} · ${esc(f.mod)}</span><span>College of Clinical Pharmacy, IAU, Dammam · Room [__]</span><span class="hint">Reminder sent 24 hours before</span></div><button class="btn ghost" type="button" data-act="facCancel">Cancel or reschedule</button>`:`<p>Book a 30-minute face-to-face session with a clinical pharmacy faculty member at the college.</p>
  <div class="field"><label for="facTopic">Session type</label><select id="facTopic">${['Concept I keep getting wrong','Study-plan review','Exam strategy and time management'].map(o=>`<option ${B.type===o?'selected':''}>${o}</option>`).join('')}</select></div>
  <div class="field"><label for="facMod">Module</label><select id="facMod">${MODS.map(m=>{const v=m.c+' · '+m.n;return`<option ${B.mod===v?'selected':''}>${v}</option>`}).join('')}</select></div>
  <div class="field"><span class="hint">Choose a day</span><div class="slots">${days.map((d,i)=>`<button type="button" data-act="pickDay" data-i="${i}" aria-pressed="${B.day===i}">${d}</button>`).join('')}</div></div>
  ${B.day!=null?`<div class="field"><span class="hint">Choose a time · ${days[B.day]}</span><div class="slots">${['10:00','11:30','13:00','14:30'].map((t,j)=>`<button type="button" data-act="pickTime" data-t="${t}" aria-pressed="${B.time===t}" ${(B.day+j)%3===0?'disabled aria-label="'+t+' already booked"':''}>${t}</button>`).join('')}</div></div>`:''}
  <p class="hint">Location: College of Clinical Pharmacy, IAU, Dammam · Room [__]</p>
  <button class="btn gold" type="button" data-act="facSend" ${B.day==null||!B.time?'disabled':''}>Book appointment</button>`;
  body+=dev(['Booking calendar linked to faculty office hours','Room booking at the college','Email/SMS reminders and cancellations','Faculty time per session (paid or in-kind) and a no-show policy'])}
 h.innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${kind==='chat'?'Community chat':'Book a faculty appointment'}"><div class="dhead"><h2>${kind==='chat'?'Community chat':'Book a faculty appointment'}</h2><span class="spacer"></span><button class="btn ghost" type="button" data-act="close">Close</button></div><div class="dbody">${body}</div>${foot}</aside>`;
 const d=h.querySelector('.dbody');d.scrollTop=d.scrollHeight;
}
function keepBook(){const t=$('#facTopic'),m=$('#facMod');if(t)S.book.type=t.value;if(m)S.book.mod=m.value}
function workDays(){const out=[],d=new Date();while(out.length<6){d.setDate(d.getDate()+1);const w=d.getDay();if(w!==5&&w!==6)out.push(d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))}return out}
function closeDrawer(){$('#drawerHost').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Enter'&&e.target.id==='chatIn'){e.preventDefault();document.querySelector('[data-act="chatSend"]').click()}});
$('#btnCommunity').onclick=()=>drawer('chat');
$('#btnFaculty').onclick=()=>drawer('faculty');
$('#btnDev').onclick=e=>{const on=document.body.classList.toggle('nodev');e.currentTarget.setAttribute('aria-pressed',String(!on))};
$('#btnRestart').onclick=()=>{S=fresh();closeDrawer();render();nudge('Restarted','The simulation is back at plan selection.')};
render();
setTimeout(()=>nudge('Start here','Choose Premium to begin. Purple boxes are developer notes on what to cost.'),600);
</script>
